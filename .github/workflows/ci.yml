name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: "4.1.2"
  ANCHOR_VERSION: "1.2.0"

jobs:
  js:
    name: TypeScript (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm --filter @manifest/sdk build
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build

  program:
    name: Program (fmt, clippy, build, LiteSVM tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Cache Solana toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
            ~/.local/bin/anchor
          key: solana-${{ env.SOLANA_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}
      - name: Install Solana CLI and Anchor CLI
        run: |
          mkdir -p ~/.local/bin
          if [ ! -x ~/.local/share/solana/install/active_release/bin/solana ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          fi
          if [ ! -x ~/.local/bin/anchor ]; then
            curl -sSfL -o ~/.local/bin/anchor \
              "https://github.com/solana-foundation/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
            chmod +x ~/.local/bin/anchor
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build program
        # CI has no program keypair (it is a secret); --ignore-keys skips the keypair vs
        # declare_id! check. LiteSVM loads the .so at manifest::ID, so tests are unaffected.
        run: NO_DNA=1 anchor build --ignore-keys
      - run: cargo test -p manifest
      - run: cargo test -p manifest-tests
      - name: IDL in the SDK is up to date
        run: |
          node packages/sdk/scripts/sync-idl.mjs
          git diff --exit-code packages/sdk/src/idl
